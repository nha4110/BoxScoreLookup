spring.application.name=boxscore-backend

# Supply the Supabase connection details through Fly.io secrets or environment variables.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${PORT:8080}
